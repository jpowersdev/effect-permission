name: Release

# Temporary branch only: checks that npm trusted publishing accepts this
# workflow, by exchanging GitHub's OIDC token the way `npm publish` does.
# Nothing is published, and no token is printed.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check npm trusted publishing
    if: github.repository_owner == 'jpowersdev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Exchange the GitHub OIDC token for an npm token
        run: |
          id_token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$id_token"
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@jpowersdev%2feffect-permission")
          echo "npm token exchange: HTTP $status"
          if jq -e 'has("token")' response.json > /dev/null; then
            echo "npm accepted this workflow as a trusted publisher for @jpowersdev/effect-permission"
          else
            jq -c 'del(.token)' response.json || cat response.json
            exit 1
          fi
          rm response.json
